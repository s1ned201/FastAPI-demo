[project]
name = "fastapi-demo"
version = "0.1.0"
description = "FastAPI project with poetry"
authors = [
    {name = "Denis",email = "s.1ned@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)"
]

[tool.poetry]
packages = [{include = "fastapi_demo", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)"
]
dev = [
    "ruff (>=0.15.17,<0.16.0)"
]
